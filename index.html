<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vista</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#141a20; --panel2:#1b232b; --line:#232c36;
    --txt:#e8eef4; --dim:#8a97a6; --up:#22c55e; --down:#ef4444; --accent:#f0b90b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35;padding-bottom:64px}
  header{position:sticky;top:0;z-index:10;background:rgba(11,14,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.tg{display:block;text-align:center;font-size:12.5px;padding:8px 14px;background:linear-gradient(90deg,#229ED9,#1a7fb0);color:#fff;text-decoration:none;font-weight:600}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:20px;margin:0;letter-spacing:.5px;font-weight:700}
  .brand span{color:var(--dim);font-size:12px}
  .globals{display:flex;gap:18px;margin-top:8px;font-size:12px;color:var(--dim)}
  .globals b{color:var(--txt);font-weight:600}
  main{padding:6px 0 0}
  .row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:active{background:var(--panel)}
  .rank{color:var(--dim);font-size:12px;width:18px;text-align:right;flex:none}
  .logo{width:26px;height:26px;border-radius:50%;flex:none;background:var(--panel2)}
  .id{flex:1;min-width:0}
  .id .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .id .sy{color:var(--dim);font-size:12px;text-transform:uppercase}
  .spark{width:64px;height:26px;flex:none}
  .num{text-align:right;flex:none;min-width:78px}
  .num .px{font-variant-numeric:tabular-nums}
  .num .ch{font-size:12px;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)}
  .msg{padding:28px 16px;color:var(--dim);text-align:center}
  .btn{display:inline-block;margin-top:12px;padding:9px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--txt);font-size:14px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:rgba(11,14,17,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--dim);font-size:12px;padding:10px 0 12px;font-family:inherit}
  nav button.on{color:var(--accent)}
  nav button i{display:block;font-size:17px;font-style:normal;margin-bottom:2px}
  /* detail */
  .dhead{display:flex;align-items:center;gap:10px;padding:14px}
  .dhead .logo{width:34px;height:34px}
  .dhead .nm{font-size:17px;font-weight:700}
  .dhead .sy{color:var(--dim);font-size:12px;text-transform:uppercase}
  .back{background:none;border:0;color:var(--accent);font-size:15px;padding:0 6px 0 0;font-family:inherit}
  .big{padding:0 14px}
  .big .price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .big .chg{font-size:14px;margin-left:8px}
  .tabs{display:flex;gap:8px;padding:12px 14px 6px}
  .tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit}
  .tabs button.on{color:var(--txt);border-color:var(--accent)}
  canvas.chart{display:block;width:100%;height:210px;padding:0 6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:12px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stats div{background:var(--panel);padding:10px 12px}
  .stats .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .stats .v{font-variant-numeric:tabular-nums;margin-top:2px}
  .sig{margin:0 14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .sig h3{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .sig .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
  .sig .line:last-child{border-bottom:0}
  .sig .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--txt)}
  .disc{color:var(--dim);font-size:11px;margin:6px 14px 18px;line-height:1.5}
  /* news */
  .news{padding:4px 0}
  .news a{display:block;padding:12px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
  .news a:active{background:var(--panel)}
  .news .t{font-weight:600;font-size:14.5px}
  .news .m{color:var(--dim);font-size:12px;margin-top:4px}
  .src{padding:10px 14px 2px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Vista</h1><span id="upd">—</span></div>
  <div class="globals">
    <div>Cap. <b id="gcap">—</b></div>
    <div>24h <b id="gchg">—</b></div>
    <div>BTC dom. <b id="gdom">—</b></div>
  </div>
</header>
<a class="tg" href="https://t.me/tradingnewsbot_richy" target="_blank" rel="noopener">📣 Notizie crypto IT + EN su Telegram → @tradingnewsbot_richy</a>
<main id="app"><div class="msg">Carico i dati…</div></main>
<nav>
  <button id="nav-mkt" class="on"><i>◧</i>Mercato</button>
  <button id="nav-news"><i>≡</i>News</button>
</nav>
<script>
"use strict";
var CG="https://api.coingecko.com/api/v3";
var $=function(id){return document.getElementById(id)};
var app=$("app");
var coins=[], view="market", sel=null, chartDays=7, timer=null;

function fmtUSD(n){
  if(n==null||isNaN(n))return "—";
  var d;
  if(n>=1000)d={minimumFractionDigits:0,maximumFractionDigits:0};
  else if(n>=1)d={minimumFractionDigits:2,maximumFractionDigits:2};
  else if(n>=0.01)d={minimumFractionDigits:4,maximumFractionDigits:4};
  else d={minimumFractionDigits:2,maximumFractionDigits:8};
  return "$"+n.toLocaleString("en-US",d);
}
function fmtBig(n){
  if(n==null)return "—";
  if(n>=1e12)return "$"+(n/1e12).toFixed(2)+"T";
  if(n>=1e9)return "$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return "$"+(n/1e6).toFixed(2)+"M";
  return fmtUSD(n);
}
function pct(n){
  if(n==null||isNaN(n))return "—";
  return (n>=0?"+":"")+n.toFixed(2)+"%";
}
function cls(n){return n>=0?"up":"down"}

function sparkline(canvas,data,up){
  var dpr=window.devicePixelRatio||1, w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!data||data.length<2)return;
  var mn=Math.min.apply(null,data), mx=Math.max.apply(null,data), r=(mx-mn)||1;
  ctx.beginPath();
  for(var i=0;i<data.length;i++){
    var x=i/(data.length-1)*w, y=h-2-((data[i]-mn)/r)*(h-4);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.strokeStyle=up?"#22c55e":"#ef4444"; ctx.lineWidth=1.4; ctx.stroke();
}

function lineChart(canvas,series){
  var dpr=window.devicePixelRatio||1, w=canvas.clientWidth, h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!series||series.length<2)return;
  var mn=Math.min.apply(null,series), mx=Math.max.apply(null,series), r=(mx-mn)||1;
  var pad=10, W=w-2*pad, H=h-2*pad;
  // grid
  ctx.strokeStyle="#232c36"; ctx.lineWidth=1;
  for(var g=0;g<=4;g++){var gy=pad+H*g/4; ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(pad+W,gy);ctx.stroke();}
  // area
  ctx.beginPath();
  for(var i=0;i<series.length;i++){
    var x=pad+i/(series.length-1)*W, y=pad+H-((series[i]-mn)/r)*H;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.strokeStyle="#f0b90b"; ctx.lineWidth=1.8; ctx.stroke();
  ctx.lineTo(pad+W,pad+H); ctx.lineTo(pad,pad+H); ctx.closePath();
  ctx.fillStyle="rgba(240,185,11,.08)"; ctx.fill();
  // labels
  ctx.fillStyle="#8a97a6"; ctx.font="11px -apple-system,sans-serif";
  ctx.fillText(fmtUSD(mx),pad,pad-1+10); ctx.fillText(fmtUSD(mn),pad,pad+H-2);
}

function computeIndicators(prices){
  function ma(n){ if(prices.length<n)return null; var s=0; for(var i=prices.length-n;i<prices.length;i++)s+=prices[i]; return s/n; }
  var rsi=null;
  if(prices.length>15){
    var gains=0,losses=0;
    for(var i=prices.length-14;i<prices.length;i++){
      var ch=prices[i]-prices[i-1];
      if(ch>=0)gains+=ch; else losses-=ch;
    }
    var ag=gains/14, al=losses/14;
    rsi=al===0?100:100-(100/(1+ag/al));
  }
  return {ma7:ma(7),ma30:ma(30),rsi:rsi};
}
function rsiTag(r){
  if(r==null)return ["—",""];
  if(r>=70)return ["Ipercomprato",r.toFixed(1)];
  if(r<=30)return ["Ipervenduto",r.toFixed(1)];
  return ["Neutro",r.toFixed(1)];
}

function renderMarket(){
  var h="";
  for(var i=0;i<coins.length;i++){
    var c=coins[i], ch=c.price_change_percentage_24h;
    h+='<div class="row" data-id="'+c.id+'">'
      +'<div class="rank">'+(c.market_cap_rank||i+1)+'</div>'
      +'<img class="logo" loading="lazy" src="'+c.image+'" alt="">'
      +'<div class="id"><div class="nm">'+c.name+'</div><div class="sy">'+c.symbol+'</div></div>'
      +'<canvas class="spark" data-spark="'+i+'"></canvas>'
      +'<div class="num"><div class="px">'+fmtUSD(c.current_price)+'</div>'
      +'<div class="ch '+cls(ch)+'">'+pct(ch)+'</div></div></div>';
  }
  app.innerHTML=h;
  var cvs=app.querySelectorAll("canvas[data-spark]");
  for(var j=0;j<cvs.length;j++){
    var c=coins[+cvs[j].getAttribute("data-spark")];
    var arr=(c.sparkline_in_7d&&c.sparkline_in_7d.price)||[];
    sparkline(cvs[j],arr,c.price_change_percentage_24h>=0);
  }
}

function renderDetail(){
  var c=sel;
  var ch=c.price_change_percentage_24h;
  app.innerHTML=
   '<div class="dhead"><button class="back" id="back">‹</button>'
   +'<img class="logo" src="'+c.image+'" alt="">'
   +'<div><div class="nm">'+c.name+'</div><div class="sy">'+c.symbol+'</div></div></div>'
   +'<div class="big"><span class="price">'+fmtUSD(c.current_price)+'</span>'
   +'<span class="chg '+cls(ch)+'">'+pct(ch)+' (24h)</span></div>'
   +'<div class="tabs">'
   +'<button data-days="1" class="'+(chartDays===1?"on":"")+'">24H</button>'
   +'<button data-days="7" class="'+(chartDays===7?"on":"")+'">7G</button>'
   +'<button data-days="30" class="'+(chartDays===30?"on":"")+'">30G</button>'
   +'<button data-days="365" class="'+(chartDays===365?"on":"")+'">1A</button>'
   +'</div>'
   +'<canvas class="chart" id="chart"></canvas>'
   +'<div class="stats">'
   +'<div><div class="k">Max 24h</div><div class="v">'+fmtUSD(c.high_24h)+'</div></div>'
   +'<div><div class="k">Min 24h</div><div class="v">'+fmtUSD(c.low_24h)+'</div></div>'
   +'<div><div class="k">Volume 24h</div><div class="v">'+fmtBig(c.total_volume)+'</div></div>'
   +'<div><div class="k">Cap. mercato</div><div class="v">'+fmtBig(c.market_cap)+'</div></div>'
   +'</div>'
   +'<div class="sig" id="sig"><h3>Indicatori</h3><div class="line"><span>Calcolo…</span></div></div>'
   +'<div class="disc">Indicatori calcolati sui prezzi di chiusura. Non sono previsioni e non sono consulenza finanziaria. Dati: CoinGecko.</div>';
  $("back").onclick=function(){view="market";sel=null;render()};
  var tb=app.querySelectorAll(".tabs button");
  for(var i=0;i<tb.length;i++)tb[i].onclick=function(){chartDays=+this.getAttribute("data-days");renderDetail();loadChart()};
  loadChart();
}

function loadChart(){
  var canvas=$("chart"); if(!canvas)return;
  fetch(CG+"/coins/"+sel.id+"/market_chart?vs_currency=usd&days="+chartDays)
   .then(function(r){return r.json()})
   .then(function(j){
     var pts=(j.prices||[]).map(function(p){return p[1]});
     if(!$("chart"))return;
     lineChart(canvas,pts);
     var ind=computeIndicators(pts);
     var t=rsiTag(ind.rsi);
     var s=$("sig"); if(!s)return;
     var maTag=function(v){
       if(v==null)return '<span class="tag">—</span>';
       var rel=sel.current_price>=v?'Sopra':'Sotto';
       return '<span class="tag">'+rel+' ('+fmtUSD(v)+')</span>';
     };
     s.innerHTML='<h3>Indicatori</h3>'
      +'<div class="line"><span>Media 7</span>'+maTag(ind.ma7)+'</div>'
      +'<div class="line"><span>Media 30</span>'+maTag(ind.ma30)+'</div>'
      +'<div class="line"><span>RSI 14</span><span class="tag">'+t[0]+' '+t[1]+'</span></div>';
   })
   .catch(function(){ var s=$("sig"); if(s)s.innerHTML='<h3>Indicatori</h3><div class="line"><span>Dati non disponibili</span></div>'; });
}

var NEWS_FEEDS=[
  {name:"Cointelegraph", url:"https://cointelegraph.com/rss"},
  {name:"Decrypt", url:"https://decrypt.co/feed"}
];
function renderNews(){
  app.innerHTML='<div class="msg">Carico le news…</div>';
  var done=0, all=[];
  NEWS_FEEDS.forEach(function(f){
    fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.url)+"&count=8")
     .then(function(r){return r.json()})
     .then(function(j){
       if(j.status==="ok"&&j.items){
         j.items.forEach(function(it){ all.push({t:it.title,u:it.link,d:it.pubDate,s:f.name}) });
       }
     })
     .catch(function(){})
     .then(function(){
       done++;
       if(done<NEWS_FEEDS.length)return;
       if(!all.length){ app.innerHTML='<div class="msg">News non raggiungibili.<br><span class="btn" id="retry">Riprova</span></div>'; var b=$("retry"); if(b)b.onclick=renderNews; return; }
       all.sort(function(a,b){return new Date(b.d)-new Date(a.d)});
       var h='<div class="news">';
       all.slice(0,18).forEach(function(n){
         var when=n.d?new Date(n.d).toLocaleString("it-IT",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
         h+='<a href="'+n.u+'" target="_blank" rel="noopener"><div class="t">'+n.t+'</div><div class="m">'+n.s+' · '+when+'</div></a>';
       });
       h+='</div>';
       app.innerHTML=h;
     });
  });
}

function render(){
  $("nav-mkt").className=view==="market"?"on":"";
  $("nav-news").className=view==="news"?"on":"";
  if(view==="market")renderMarket();
  else if(view==="news")renderNews();
  else renderDetail();
}

function loadMarkets(){
  fetch(CG+"/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=25&page=1&sparkline=true&price_change_percentage=24h")
   .then(function(r){ if(!r.ok)throw 0; return r.json() })
   .then(function(j){
     coins=j;
     var d=new Date();
     $("upd").textContent="agg. "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
     if(view==="market")render();
   })
   .catch(function(){
     if(!coins.length){
       app.innerHTML='<div class="msg">Dati non raggiungibili.<br><span class="btn" id="retry">Riprova</span></div>';
       var b=$("retry"); if(b)b.onclick=loadMarkets;
     }
   });
}
function loadGlobal(){
  fetch(CG+"/global").then(function(r){return r.json()}).then(function(j){
    var g=j.data; if(!g)return;
    $("gcap").textContent=fmtBig(g.total_market_cap.usd);
    var ch=g.market_cap_change_percentage_24h_usd;
    var e=$("gchg"); e.textContent=pct(ch); e.className=cls(ch);
    $("gdom").textContent=(g.market_cap_percentage.btc||0).toFixed(1)+"%";
  }).catch(function(){});
}

app.addEventListener("click",function(e){
  var row=e.target.closest?e.target.closest(".row"):null;
  if(row){
    var id=row.getAttribute("data-id");
    for(var i=0;i<coins.length;i++)if(coins[i].id===id){sel=coins[i];break}
    if(sel){view="detail";chartDays=7;render();window.scrollTo(0,0)}
  }
});
$("nav-mkt").onclick=function(){view="market";sel=null;render();window.scrollTo(0,0)};
$("nav-news").onclick=function(){view="news";sel=null;render();window.scrollTo(0,0)};

loadMarkets(); loadGlobal();
timer=setInterval(function(){loadMarkets();loadGlobal()},60000);
window.addEventListener("resize",function(){ if(view==="market")renderMarket(); else if(view==="detail")loadChart(); });
</script>
</body>
</html>
