name: Private brief

# Bot privato di Richy. Stesso motore del canale, ma in DM (@Richytrading_aibot).
# Gira gratis su GitHub Actions: nessun server, nessun costo.
# Segreto richiesto: PRIVATE_BOT_TOKEN (token del bot privato).
#
# Questo loop deve restare VIVO. Per questo:
#  - la risposta ai messaggi gira ogni 20 secondi (--poll, leggero)
#  - il giro pesante (paper + news + brief) gira ogni ~4 minuti (n % 12)
#  - il battito (hb_private.txt) si salva a ogni giro, cosi' il watchdog lo vede
#  - il rilancio parte anche se questo job fallisce (if: always()), non solo
#    in caso di successo: un errore non deve lasciare il bot muto fino al cron.
on:
  schedule:
    - cron: "13,33,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dipendenze
        run: pip install --quiet pillow

      - name: Loop del bot privato (risposta ogni 20s, giro pesante ogni ~4 min, ~5h30)
        continue-on-error: true
        env:
          PRIVATE_BOT_TOKEN: ${{ secrets.PRIVATE_BOT_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          git config user.name "tn-bot"
          git config user.email "tn-bot@users.noreply.github.com"
          # Diagnosi chat: se un webhook fosse attivo, getUpdates darebbe 409 e il
          # bot non risponderebbe mai pur sembrando vivo. Lo tolgo e lo stampo nei
          # log, cosi' la causa e' visibile invece che indovinata.
          timeout 40 python -m tn.private --doctor || echo "doctor non riuscito"
          guard() {
            if git diff --staged | grep -Eq '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{30,}'; then
              echo "SECRET GUARD: possibile token nei file staged, commit annullato"; return 1
            fi
            return 0
          }
          # Ogni comando di rete ha un tetto di tempo: un git push bloccato non
          # deve congelare il loop.
          end=$(( $(date +%s) + 19800 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            # Risposta ai messaggi ogni 20s: l'utente non deve MAI aspettare il
            # giro pesante per avere una risposta.
            timeout 90 python -m tn.private --poll || true
            n=$((n + 1))
            date -u +%FT%TZ > hb_private.txt
            if [ $((n % 6)) -eq 0 ]; then
              echo "== giro $(date -u +%FT%TZ) =="
              # Se su main c'e' codice piu' nuovo del mio checkout, esco: una run
              # nuova fara' il giro col codice aggiornato.
              timeout 60 git fetch --quiet origin main || true
              if ! timeout 30 git diff --quiet HEAD origin/main -- tn newsbot.py .github/workflows 2>/dev/null; then
                echo "checkout vecchio: esco per lasciare il posto a una run nuova"
                exit 0
              fi
              timeout 420 python -m tn.private --auto || echo "giro fallito, continuo"
              # desk_log.jsonl e' il quaderno di addestramento: ogni giro dei tre
              # ruoli ci scrive cosa ha visto e cosa ha deciso. Va versionato.
              for f in private_state.json paper_state.json ai_cache.json desk_log.jsonl \
                       hb_private.txt strat_cache.json audit_state.json; do
                [ -f "$f" ] && git add -f "$f" || true
              done
              if [ $((n % 12)) -eq 0 ] && ! git diff --cached --quiet; then
                if guard; then
                  timeout 60 git commit -m "private state $(date -u +%FT%TZ)" || true
                  timeout 90 git pull --rebase --autostash --quiet || { git rebase --abort 2>/dev/null || true; }
                  timeout 90 git push --quiet || echo "push fallito, riprovo al giro dopo"
                fi
              fi
            fi
            sleep 20
          done

      - name: Rilancia il loop
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          PRIVATE_BOT_TOKEN: ${{ secrets.PRIVATE_BOT_TOKEN }}
        run: |
          # Non accavallare catene del bot privato.
          active=$(curl -s -H "Authorization: token ${{ secrets.TN_DISPATCH_TOKEN }}" -H "User-Agent: tn-bot" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/private.yml/runs?per_page=30" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('workflow_runs',[]);print(sum(1 for x in r if str(x['id'])!='$RUN_ID' and x['status'] in ('queued','in_progress','pending','requested','waiting')))")
          if [ "${active:-0}" -gt 0 ]; then echo "catena gia' attiva ($active), salto"; exit 0; fi
          # Un 401 qui spegneva il loop in silenzio: ora il codice lo leggo e
          # se il rilancio non parte lo dico a Richy sul bot privato.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.TN_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: tn-bot" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/private.yml/dispatches \
            -d '{"ref":"main"}')
          echo "rilancio -> $code"
          if [ "$code" != "204" ]; then
            python -m tn.alert "Bot privato: il rilancio non e' partito (HTTP $code). La chiave GitHub e' scaduta o morta, la catena si spegne qui." || true
            exit 1
          fi
