name: TRADING NEWS AI

# Il canale si aggiorna da solo, gratis, anche quando Nico non c'e'.
# GitHub Actions su repo pubblico = minuti illimitati, nessun server, nessun costo.
#
# Perche' un loop e non solo un cron: lo scheduler gratuito di GitHub droppa i cron
# (specie al minuto 0) e per questo repo si e' fermato per ore. Quindi ogni job gira
# ~5h30 facendo un giro del bot ogni 20 minuti, e alla fine rilancia da solo il job
# successivo. Il cron resta come rete di sicurezza se la catena si rompe.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write             # serve per salvare lo stato tra un giro e l'altro

concurrency:
  group: tn
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dipendenze
        run: pip install --quiet pillow

      - name: Loop del bot (giro ogni 5 min, ~5h30)
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_KEY_2: ${{ secrets.AI_API_KEY_2 }}
          AI_BASE_URL_2: ${{ secrets.AI_BASE_URL_2 }}
          AI_MODEL_2: ${{ secrets.AI_MODEL_2 }}
          VISTA_AFFILIATE: ${{ secrets.VISTA_AFFILIATE }}
          VISTA_DIGEST_EVERY_H: "2"
          # News: controllo ogni ~5 min. Cosi' ogni notizia fresca parte subito,
          # non al prossimo digest.
          VISTA_NEWS_EVERY_H: "0.08"
        run: |
          git config user.name "tn-bot"
          git config user.email "tn-bot@users.noreply.github.com"
          # Guardia anti-leak: prima di ogni commit, rifiuta di pushare se nello
          # staged compare qualcosa che sembra un token. Il 28/09 un .env col token
          # del bot e' finito nel repo pubblico: questo passo impedisce il bis.
          guard() {
            if git diff --staged | grep -Eq '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{30,}'; then
              echo "SECRET GUARD: possibile token nei file staged, commit annullato"; return 1
            fi
            return 0
          }
          end=$(( $(date +%s) + 19800 ))   # 5h30
          while [ "$(date +%s)" -lt "$end" ]; do
            echo "== giro $(date -u +%FT%TZ) =="
            # Se su main c'e' codice piu' nuovo del mio checkout, esco: una run
            # nuova fara' il giro col codice aggiornato.
            timeout 60 git fetch --quiet origin main || true
            if ! timeout 30 git diff --quiet HEAD origin/main -- tn newsbot.py .github/workflows 2>/dev/null; then
              echo "checkout vecchio: esco per lasciare il posto a una run nuova"
              exit 0
            fi
            timeout 900 python newsbot.py --auto || echo "giro fallito, continuo"
            date -u +%FT%TZ > hb_tn.txt
            for f in alert_state.json digest_state.json news_state.json \
                     ai_cache.json \
                     brief_state.json event_state.json commands_state.json \
                     weekly_state.json close_state.json sunday_state.json hb_tn.txt \
                     strat_cache.json; do
              [ -f "$f" ] && git add -f "$f"
            done
            if ! git diff --staged --quiet; then
              if guard; then
                timeout 60 git commit -m "state: $(date -u +%FT%TZ)" || true
                # Push con 3 tentativi. Il 28/10 il loop si e' piantato DOPO il
                # primo giro: lo stato restava su disco ma nessun commit arrivava
                # su main, e il canale e' rimasto muto 2h30 senza un avviso.
                # Qui: se il push non passa 3 volte, esco e avviso, cosi' una run
                # nuova (checkout pulito) riparte invece di restare zitta.
                ok=0
                for try in 1 2 3; do
                  if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then git rebase --abort 2>/dev/null || true; fi
                  timeout 60 git fetch -q origin main || true
                  timeout 90 git pull --rebase --autostash -q || { git rebase --abort 2>/dev/null || true; git stash drop 2>/dev/null || true; }
                  if timeout 90 git push -q; then ok=1; break; fi
                  echo "push tentativo $try fallito, riprovo"
                  timeout 20 sleep 15
                done
                if [ "$ok" != 1 ]; then
                  echo "stato non pushato dopo 3 tentativi: esco per il riavvio"
                  python -m tn.alert "Canale news: non riesco a pushare lo stato (3 tentativi). Riavvio la catena." || true
                  exit 1
                fi
              else
                timeout 30 git reset -q
              fi
            fi
            sleep 300
          done

      - name: Rilancia il prossimo job (catena)
        if: always()
        env:
          GH_PAT: ${{ secrets.TN_DISPATCH_TOKEN }}
          PRIVATE_BOT_TOKEN: ${{ secrets.PRIVATE_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Niente catene accavallate: se un'altra run del news e' gia' viva o in
          # coda, non ne lancio una seconda. Cosi' un rilancio o un cron non
          # spengono/duplicano il loop che sta gia' postando.
          active=$(curl -s -H "Authorization: token $GH_PAT" -H "User-Agent: tn-bot" \
            "https://api.github.com/repos/richy77-tech/vista/actions/workflows/tn.yml/runs?per_page=30" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('workflow_runs',[]);print(sum(1 for x in r if str(x['id'])!='$RUN_ID' and x['status'] in ('queued','in_progress','pending')))")
          if [ "${active:-0}" -gt 0 ]; then echo "catena gia' attiva ($active), salto il rilancio"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: tn-bot" \
            "https://api.github.com/repos/richy77-tech/vista/actions/workflows/tn.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch -> $code"
          if [ "$code" != "204" ]; then
            python -m tn.alert "Canale news: il rilancio non e' partito (HTTP $code). La chiave GitHub e' scaduta o morta." || true
          fi
