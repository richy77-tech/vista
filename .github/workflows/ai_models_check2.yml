name: ai-models-check2

on:
  workflow_dispatch:

permissions:
  models: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Varianti endpoint
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ["GH_MODELS_TOKEN"]
          gt = os.environ.get("GITHUB_TOKEN", "")
          def call(url, data=None, h=None, method=None):
              hh = {"Authorization": "Bearer " + tok, "Content-Type": "application/json"}
              if h: hh.update(h)
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data is not None else None,
                                           headers=hh, method=method)
              try:
                  r = urllib.request.urlopen(req, timeout=40)
                  return r.status, r.read()[:500], dict(r.headers).get("content-type")
              except Exception as e:
                  return "ERR", str(e)[:200], ""
          msg = {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "say pong"}]}
          print("A azure", call("https://models.inference.ai.azure.com/chat/completions", msg))
          print("B apiver", call("https://models.github.ai/inference/chat/completions?api-version=2024-05-01-preview", msg,
                                 {"X-GitHub-Api-Version": "2022-11-28"}))
          print("C models", call("https://models.github.ai/inference/models", method="GET"))
          print("D openai", call("https://models.github.ai/openai/chat/completions", msg))
          print("E gt", call("https://models.github.ai/inference/chat/completions", msg,
                             {"Authorization": "Bearer " + gt}))
          print("F www", call("https://models.github.ai", method="GET"))
          PY
