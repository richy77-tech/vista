name: Watchdog

# Rete di sicurezza: il bot news e il bot privato non devono MAI restare fermi.
# Ogni 15 minuti controllo se esiste una run viva della catena; se no, la riavvio.
# Cosi' se il loop muore (cron droppato, run cancellata, errore), il canale
# riparte da solo senza che nessuno debba toccare niente.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Catene vive?
        env:
          GH_PAT: ${{ secrets.TN_DISPATCH_TOKEN }}
        run: |
          for wf in tn.yml private.yml; do
            n=$(curl -s -H "Authorization: token $GH_PAT" -H "User-Agent: watchdog" \
              "https://api.github.com/repos/richy77-tech/vista/actions/workflows/$wf/runs?per_page=20" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('workflow_runs',[]);print(sum(1 for x in r if x['status'] in ('queued','in_progress','pending')))")
            if [ "${n:-0}" -eq 0 ]; then
              echo "$wf fermo, lo riavvio"
              curl -s -o /dev/null -w "$wf dispatch -> %{http_code}\n" -X POST \
                -H "Authorization: token $GH_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/richy77-tech/vista/actions/workflows/$wf/dispatches" \
                -d '{"ref":"main"}'
            else
              echo "$wf vivo ($n run attive)"
            fi
          done
